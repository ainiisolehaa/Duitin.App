name: duitin
description: "Duitin - Smart Daily Expense Tracker. Aplikasi pencatatan keuangan pribadi untuk mahasiswa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database Lokal SQLite
  sqflite: ^2.4.1
  path: ^1.9.0

  # Shared Preferences (session & preferences)
  shared_preferences: ^2.3.2

  # Grafik Statistik
  fl_chart: ^0.69.0

  # Format Rupiah dan Tanggal
  intl: ^0.20.1

  # Hashing Password (SHA-256)
  crypto: ^3.0.3

  # Pemilih Gambar (Foto Profil)
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
